backend:
  name: git-gateway
  branch: main # Vérifie si ta branche sur GitHub s'appelle bien main

media_folder: "assets/img"
public_folder: "/assets/img"

collections:
  - name: "annonces"
    label: "Annonces"
    folder: "content/annonces"
    create: true
    slug: "{{slug}}"
    fields:
      - {label: "Titre", name: "title", widget: "string"}
      - {label: "Date de publication", name: "date", widget: "datetime"}
      - {label: "Contenu de l'annonce", name: "body", widget: "markdown"}